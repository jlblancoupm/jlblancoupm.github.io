intro: My research is concerned with learning, identifying and understanding systems from the signals they generate, combining interpretable models, signal processing and data-driven learning.

themes:
  - id: identification
    title: System identification & inverse problems
    text: Methods for estimating, characterizing and inverting complex signal-generating systems from observations, including optimization and homotopy-driven approaches.
    topics: [System identification, Inverse problems, Optimization, Homotopy methods]
    examples:
      - title: Generalized homotopy methods for system identification
        summary: Controlled examples and interactive material for studying generalized homotopy-based solution strategies.
        links:
          - label: Code
            url: https://github.com/jlblancoupm/gham-pendulum-lab
      - title: Volterra-Wiener nonlinear system identification
        summary: Model-order and memory selection for nonlinear systems from exponential-sweep measurements.
        links:
          - label: Paper
            url: https://doi.org/10.1007/s11045-017-0535-3

  - id: physical-models
    title: Physical, differentiable & analysis-by-synthesis modeling
    text: Physical and procedural models used not only for synthesis, but also as tools for parameter estimation, inversion, interpretation and hypothesis testing.
    topics: [Physical modeling, Differentiable modeling, Analysis-by-synthesis, Parameter estimation]
    examples:
      - title: Physical modeling of human vocalization
        summary: Parameter optimization and inversion of a physical model of the human vocal system.
        links:
          - label: Paper
            url: https://doi.org/10.1186/s13636-025-00414-5

  - id: generative-audio
    title: Generative learning for audio & speech
    text: Generative and representation-learning approaches for audio and speech, with particular interest in controllable representations and physically meaningful constraints.
    topics: [Generative learning, Audio synthesis, Speech, Representation learning]
    examples:
      - title: Neural audio synthesis for sound effects
        summary: Scope and methodological analysis of neural approaches to sound-effect synthesis.
        links:
          - label: Paper
            url: https://doi.org/10.1109/TASLPRO.2025.3646080
      - title: Phase-aware variational models for audio
        summary: Representation learning for audio effects with phase-aware transformations.
        links:
          - label: Paper
            url: https://doi.org/10.17743/jaes.2022.0042

  - id: nonlinear
    title: Nonlinear systems & signal quality
    text: Identification, characterization and compensation of nonlinear systems, including amplifiers, signal-quality assessment and model-informed measurement.
    topics: [Nonlinear systems, Characterization, Compensation, Signal quality]
    examples:
      - title: Model-informed amplifier assessment
        summary: Single-input characterization of amplifiers from pruned Volterra-kernel projections.
        links:
          - label: Paper
            url: https://doi.org/10.1016/j.measurement.2022.110856

  - id: communications
    title: Advanced communications & sensing
    text: Signal processing for radio, radar, beamforming and large-scale antenna systems, from algorithm design to experimental and structural constraints.
    topics: [Beamforming, Radar, RF systems, Antenna arrays]
    examples:
      - title: Large-scale antenna arrays over Goldberg polyhedra
        summary: Manufacturable hexagonal-subarray configurations for scalable large antenna arrays.
        links:
          - label: Paper
            url: https://doi.org/10.3390/electronics14234618

systems:
  - Audio, speech & sound
  - Nonlinear & physical systems
  - RF, radar & communications
  - Biomedical signals & ultrasound
  - Industrial sensing & processes
  - Visual & multimodal systems
