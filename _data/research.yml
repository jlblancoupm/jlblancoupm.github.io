directions:
- id: signal-processing-system-modeling
  title: Signal Processing & System Modeling
  summary: Methods for learning, characterizing and controlling systems from observed
    signals.
  topics:
  - System modeling and identification
  - Inverse problems
  - Nonlinear systems
  - Analysis-by-synthesis
  - Optimization and homotopy-based approaches
  examples:
  - title: Physical and differentiable system models
    text: Model-based and differentiable descriptions of signal-generating systems,
      with emphasis on interpretable inversion and parameter estimation.
  - title: Nonlinear characterization and compensation
    text: Identification, assessment and compensation of nonlinear systems, including
      Volterra/Wiener formulations and amplifier characterization.
- id: audio-speech
  title: Audio & Speech
  summary: Speech, voice and sound-producing systems, from physical models to generative
    methods.
  topics:
  - Physical and differentiable sound-producing models
  - Speech and voice processing
  - Generative audio
  - Audio synthesis
  - Acoustic analysis
  - Bioacoustics
  examples:
  - title: Articulatory and vocal-system modeling
    text: Analysis-by-synthesis and physical modeling for vocal production, inversion
      and copy-synthesis.
  - title: Generative audio and speech
    text: Neural and model-informed generation, synthesis and representation learning
      for audio and speech.
- id: communications-sensing
  title: Communications & Sensing
  summary: Signal processing for radio, radar, arrays and sensing systems.
  topics:
  - RF systems
  - Radar
  - Beamforming
  - Large-scale antenna arrays
  - System characterization and compensation
  - Multimodal sensing
  examples:
  - title: Advanced communications
    text: Beamforming, RFSoC signal processing, cognitive communications and large-scale
      array design.
  - title: Sensing and characterization
    text: Signal-based measurement and characterization across RF, ultrasound, industrial
      and biomedical systems.
applications:
- Biomedical
- Industrial
- Multimodal
- Sensing
