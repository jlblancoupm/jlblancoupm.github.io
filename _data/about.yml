intro: >-
  I am an Associate Professor in Signal Processing at Universidad Politécnica de Madrid (UPM) and Director of the Signal Processing Applications Group (GAPS-UPM). My work combines methodological research, applied R&D and technology transfer, with a recurring interest in learning, identifying and understanding complex systems from signals and observations.

research: >-
  My research spans signal processing, system identification, inverse problems and machine learning. Audio and speech are a current focus, alongside nonlinear and physical systems, radiocommunications, biomedical signals and industrial applications. I am particularly interested in connecting interpretable models with modern data-driven methods.

