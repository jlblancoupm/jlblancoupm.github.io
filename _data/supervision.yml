intro: Supervision is a core part of my research activity, with student work integrated into research lines, projects, experimental validation and open research software whenever appropriate.
metrics:
  - value: "3"
    label: completed PhD theses
  - value: "5"
    label: current PhD candidates
  - value: "30+"
    label: MSc theses supervised
  - value: "60+"
    label: final projects supervised
sections:
  - title: Doctoral supervision
    text: Completed doctoral work has covered speech technologies, radiofrequency characterization and generative models for audio. Current doctoral supervision extends these lines into signal processing, machine learning and multimodal systems.
  - title: MSc & BSc supervision
    text: Master's and Bachelor's projects are used as focused engineering and research units, commonly connected to ongoing GAPS research, experimental platforms, datasets, software or industry-facing problems.
  - title: Research progression
    text: Selected student projects are designed to progress from reproducible engineering work to research contributions, publications, reusable code or subsequent doctoral work when the scope supports it.
open_topics_intro: I regularly supervise a limited number of new BSc, MSc and PhD students. The topics below indicate areas where new projects may be possible; exact scope depends on the student's background, degree and current research activity.
open_topics:
  - title: Audio, speech & sound-producing systems
    levels: BSc · MSc · PhD
    text: Physical and differentiable models, generative audio, analysis-by-synthesis, voice and speech processing, and emerging bioacoustic applications.
  - title: System modeling & inverse problems
    levels: MSc · PhD
    text: Identification, characterization and inversion of complex systems, including nonlinear models, optimization and homotopy-driven approaches.
  - title: Communications, radar & array processing
    levels: BSc · MSc · PhD
    text: Beamforming, RF characterization, radar, large-scale arrays and data-driven methods for advanced communication systems.
  - title: Applied signal processing & machine learning
    levels: BSc · MSc
    text: Focused engineering projects connecting signal processing and machine learning with biomedical, industrial, multimedia or sensing applications.
application_intro: If you are interested in one of these topics, use the form below to prepare an application email. Please attach an updated CV, your academic transcript or marks, and a short motivation letter before sending it.
