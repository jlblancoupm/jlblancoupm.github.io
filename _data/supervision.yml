open_topics:
- title: Audio & Speech
  text: Generative and model-based audio, speech synthesis, voice analysis, physical sound-production models and related inverse
    problems.
- title: System Modeling & Inverse Problems
  text: Identification, inversion and analysis-by-synthesis for nonlinear or physically motivated signal-generating systems.
- title: Advanced Communications
  text: Beamforming, radar, RF systems, large-scale antenna arrays and signal-processing methods for communications.
- title: Applied Signal Processing & Machine Learning
  text: Applied projects in biomedical, industrial and multimodal systems where signal-processing methods can be evaluated
    on real data.
