<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css?v=4.14' | relative_url }}">
</head>
<body class="section-{{ page.section | default: 'page' }}">
  <div class="mobile-profile-header">
    {% include sidebar.html %}
  </div>

  {% include header.html %}

  <main class="page-shell{% if page.section == 'home' %} page-shell-home{% endif %}">
    {% unless page.section == 'home' %}
    <div class="desktop-profile">
      {% include sidebar.html %}
    </div>
    {% endunless %}

    <section class="content{% if page.section == 'home' %} home-content{% endif %}">
      {{ content }}
    </section>
  </main>
</body>
</html>
