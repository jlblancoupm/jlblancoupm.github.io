<header class="site-header">
  <div class="nav-wrap">
    <nav class="top-nav" aria-label="Primary">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"
         class="nav-item{% if page.section == item.id %} is-active{% endif %}"
         {% if page.section == item.id %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
